name: Release

# 推送 v 开头的标签(如 v0.1.0)时,打出各平台的独立运行包并发布到 GitHub Releases。
# 运行包自带 .NET 运行时,目标机器不需要安装 .NET。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for rid in win-x64 win-arm64 osx-arm64 osx-x64 linux-x64; do
            out="publish/Sql2Fetch-$rid"
            dotnet publish src/Sql2Fetch.App -c Release -r "$rid" --self-contained true \
              -p:Version="$version" -p:DebugType=none -o "$out"
            (cd publish && zip -qr "../dist/Sql2Fetch-${GITHUB_REF_NAME}-$rid.zip" "Sql2Fetch-$rid")
          done
          ls -lh dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
